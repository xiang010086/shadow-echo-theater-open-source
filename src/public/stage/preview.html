<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>影有回声 · 操演制作预览</title><style>html,body{margin:0;width:100%;height:100%;background:#2e211b;overflow:hidden}svg{display:block;width:100%;height:100%}</style><body><script type="module">
import {setTimeline,renderAt} from './renderer.mjs';
import {setSpriteURI} from './sprites.mjs';
import {setCompanionTextures} from './companion-sprites.mjs';
const companionTextures=await Promise.all(['rabbit-v2.png','deer-v2.png'].map(async name=>{
  const uri=URL.createObjectURL(await(await fetch(name)).blob());
  await new Promise((resolve,reject)=>{const image=new Image();image.onload=resolve;image.onerror=reject;image.src=uri;});
  return uri;
}));
setCompanionTextures(...companionTextures);
const blob=await (await fetch('./characters-v1.png')).blob();
const uri=URL.createObjectURL(blob);
await new Promise((resolve,reject)=>{const img=new Image();img.onload=resolve;img.onerror=reject;img.src=uri;});
setSpriteURI(uri);
const data=await (await fetch('./timeline.json')).json();
setTimeline(data);
window.renderAt=(clip,t)=>{document.querySelector('body').firstElementChild?.tagName==='svg'&&document.querySelector('svg').remove();document.body.insertAdjacentHTML('afterbegin',renderAt(clip,t));};
window.renderAt('welcome',2);
window.productionReady=true;
</script></body></html>
