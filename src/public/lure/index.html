<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>影有回声 · 小班主候场</title><link rel="icon" href="data:,">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}video{display:block;width:100vw;height:100vh;object-fit:contain}#error{position:fixed;bottom:0;left:0;right:0;color:#fff;background:#752c21;padding:12px;font:18px sans-serif}[hidden]{display:none!important}</style></head>
<body><video id="stage" src="../media/attract-v3/idle.mp4" autoplay loop playsinline preload="auto" aria-label="小班主循环揽客"></video><div id="error" role="alert" hidden></div>
<script>
const video=document.querySelector('#stage'),error=document.querySelector('#error');
video.addEventListener('error',()=>{error.hidden=false;error.textContent='揽客视频未能读取或解码，请检查本地素材。';});
video.addEventListener('playing',()=>{error.hidden=true;});
video.play().catch(()=>{error.hidden=false;error.textContent='按回车开始播放';});
document.addEventListener('keydown',event=>{
  if(event.key==='Enter'){video.muted=false;video.play().then(()=>{error.hidden=true;}).catch(()=>{});}
  if(event.key.toLowerCase()==='f'){
    const change=document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
    change.catch(()=>{});
  }
});
</script></body></html>
